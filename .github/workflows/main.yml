name: Python Unittest with uv

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies via uv
        run: |
          # --frozen pins CI to uv.lock: most dependencies here are
          # unconstrained, so an unfrozen sync silently picks up new releases.
          uv sync --frozen

      - name: Run unittests
        run: |
          echo "Running all unittests..."
          # -t . keeps the test packages addressed as tests.mole/... so that
          # tests/mole does not shadow the installed top-level `mole` package.
          uv run python -m unittest discover -s tests -t .
      
      - name: Run mypy
        run: |
          echo "Running all mypy..."
          uv run mypy src/

      - name: Run vermin
        run: |
          echo "Running all vermin..."
          # The DefaultFiles scripts are not imported: they are copied into the
          # run directory and executed by the cluster's own Python 3.6.8, so
          # they have to stay compatible with it rather than with requires-python.
          uv run vermin --no-tips --target=3.6 --violations src/gromacs/DefaultFiles/
          # Everything else only has to stay within requires-python = ">=3.12".
          uv run vermin --no-tips --target=3.12 --violations \
            --exclude-regex '.*DefaultFiles.*' src/
