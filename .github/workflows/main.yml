name: Python Unittest with uv

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies via uv
        run: |
          # --frozen pins CI to uv.lock: most dependencies here are
          # unconstrained, so an unfrozen sync silently picks up new releases.
          uv sync --frozen

      - name: Run unittests
        run: |
          echo "Running all unittests..."
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          # -t . keeps the test packages addressed as tests.mole/... so that
          # tests/mole does not shadow the installed top-level `mole` package.
          uv run python -m unittest discover -s tests -t .
      
      - name: Run mypy
        run: |
          echo "Running all mypy..."
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          uv run mypy src/
