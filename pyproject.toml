[project]
name = "yagaiG-libs"
version = "0.2.21"
authors = [{ name = "Yuhei Yamada", email = "tamanisikamiani@gmail.com" }]
description = "This library contains a mixture of code that can be used with YagaiG's measuring equipment and code for MD. In fact, it should have a more decent structure, but it was too much trouble, so we packaged it as it is."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "annotated-types",
    "pydantic-settings",
    "pydantic-core",
    "python-dotenv",
    "typing_extensions",
    "pyparsing",
    "lmfit",
    "ref-for-llm",
    "rdkit",
    "pandas-stubs",
    "scipy-stubs",
    "openmm>=8.5.2",
]


[project.optional-dependencies]
dev = ["build", "twine", "mypy"]
# Only gromacs.analyzing needs MDAnalysis; keep it out of the base install.
analysis = ["MDAnalysis"]

# The packages live under src/ but are published flat: `import mole.gro`,
# not `import src.mole.gro`. Spell the layout out instead of relying on
# auto-discovery, so the installed names always match the import statements.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gromacs" = ["DefaultFiles/*"]

[tool.uv.sources]
ref-for-llm = { git = "https://github.com/IndigoCarmine/ref_for_llm.git" }

[tool.mypy]
# Respect the per-module follow_imports settings below for .pyi files too.
# Without this, a per-module `follow_imports = "skip"` is ignored for stubs and
# mypy still parses them (see the rdkit override at the end of this section).
follow_imports_for_stubs = true

# MDAnalysis ships no type stubs; don't fail type-checking on its imports.
[[tool.mypy.overrides]]
module = ["MDAnalysis", "MDAnalysis.*"]
ignore_missing_imports = true

# OpenMM ships no py.typed marker either.
[[tool.mypy.overrides]]
module = ["openmm", "openmm.*"]
ignore_missing_imports = true

# The rdkit-stubs shipped with rdkit 2026.3.3 are not valid Python: in
# Chem/rdchem.pyi, GetProp() declares a parameter without a default after one
# with a default. That is a parse error, which aborts the whole mypy run
# ("errors prevented further checking"), so nothing in src/ gets checked at all.
# Skip the stubs and treat rdkit as Any until upstream fixes them.
[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "vermin>=1.7.0",
]
